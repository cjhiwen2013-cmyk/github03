<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TAIAA協會技術需求單</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #172033;
      --muted: #5d687c;
      --line: #d6dde9;
      --field: #ffffff;
      --page: #f2f6fa;
      --panel: #ffffff;
      --primary: #176b87;
      --primary-strong: #0f536a;
      --accent: #bf6b3c;
      --success: #1f7a4d;
      --warning: #9a5b13;
      --danger: #a13737;
      font-family: Arial, "Microsoft JhengHei", "PingFang TC", sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      color: var(--ink);
      background:
        linear-gradient(135deg, rgba(23, 107, 135, .13), transparent 32%),
        linear-gradient(315deg, rgba(191, 107, 60, .14), transparent 34%),
        var(--page);
    }

    main {
      width: min(960px, calc(100% - 62px));
      margin: 0 auto;
      padding: 42px 0;
    }

.layout {
  display: flex;
  justify-content: center;
}

.panel {
  width: min(680px, 100%);
}

    .panel,
    .info {
      border: 1px solid rgba(111, 125, 150, .3);
      border-radius: 8px;
      background: rgba(255, 255, 255, .9);
      box-shadow: 0 18px 44px rgba(44, 58, 82, .12);
      backdrop-filter: blur(10px);
    }

    .panel {
      padding: 30px;
    }

    .info {
      padding: 20px;
    }

    .brand {
      display: flex;
      gap: 14px;
      align-items: center;
      margin-bottom: 26px;
    }

    .mark {
      display: grid;
      width: 52px;
      height: 52px;
      flex: 0 0 auto;
      place-items: center;
      border-radius: 8px;
      color: #fff;
      background: linear-gradient(135deg, var(--primary), var(--accent));
      font-weight: 800;
      letter-spacing: 0;
    }

    h1,
    h2,
    p {
      margin-top: 0;
    }

    h1 {
      margin-bottom: 6px;
      font-size: clamp(26px, 4vw, 36px);
      line-height: 1.2;
      letter-spacing: 0;
    }

    h2 {
      margin-bottom: 12px;
      font-size: 18px;
      letter-spacing: 0;
    }

    .subtitle,
    .info p,
    .hint {
      color: var(--muted);
      line-height: 1.65;
    }

    .subtitle {
      margin-bottom: 0;
      font-size: 15px;
    }

    label {
      display: block;
      margin: 18px 0 8px;
      font-weight: 700;
    }

    input,
    textarea {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 7px;
      background: var(--field);
      color: var(--ink);
      font: inherit;
      font-size: 16px;
      outline: none;
      padding: 13px 14px;
      transition: border-color .16s ease, box-shadow .16s ease;
    }

    textarea {
      min-height: 170px;
      resize: vertical;
      line-height: 1.6;
    }

    input:focus,
    textarea:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 4px rgba(23, 107, 135, .14);
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 24px;
    }

    button {
      min-height: 46px;
      border: 0;
      border-radius: 7px;
      cursor: pointer;
      font: inherit;
      font-weight: 700;
      padding: 0 18px;
    }

    button:disabled {
      cursor: not-allowed;
      opacity: .68;
    }

    .primary {
      color: #fff;
      background: var(--primary);
    }

    .primary:hover:not(:disabled) {
      background: var(--primary-strong);
    }

    .secondary {
      border: 1px solid var(--line);
      color: var(--ink);
      background: #fff;
    }

    .status {
      min-height: 24px;
      margin-top: 18px;
      color: var(--muted);
      font-weight: 700;
      line-height: 1.5;
    }

    .status.success {
      color: var(--success);
    }

    .status.warning {
      color: var(--warning);
    }

    .status.error {
      color: var(--danger);
    }

    .meta {
      display: grid;
      gap: 10px;
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .meta li {
      border-top: 1px solid var(--line);
      padding-top: 10px;
      color: var(--muted);
      line-height: 1.5;
    }

    .meta strong {
      display: block;
      color: var(--ink);
    }

    @media (max-width: 820px) {
      main {
        width: min(100% - 24px, 640px);
        padding: 18px 0;
      }

      .layout {
        grid-template-columns: 1fr;
      }

      .panel {
        padding: 22px;
      }

      .actions button {
        width: 100%;
      }
    }
    
 .logo {
  width: 100px;
  height: 100px;
  object-fit: contain;
  border-radius: 8px;
}    
  </style>
 
</head>
<body>
  <main>
    <div class="layout">
      <section class="panel" aria-labelledby="form-title">
        <div class="brand">
          <img class="logo" src="logo.png" alt="AI協會">
          <div>
            <h1 id="form-title">TAIAA協會技術支援需求表</h1>
            <p class="subtitle">請詳細填寫技術需求內容</p>
          </div>
        </div>

        <form id="requestForm">
          <label for="name">名字</label>
          <input id="name" name="name" autocomplete="name" required>

          <label for="unit">單位</label>
          <input id="unit" name="unit" autocomplete="organization" required>

          <label for="mainDemand">主要需求</label>
          <textarea id="mainDemand" name="mainDemand" required></textarea>

          <label for="demandDate">需求日期</label>
          <input id="demandDate" name="demandDate" type="date" required>

          <div class="actions">
            <button id="submitButton" class="primary" type="submit">送出表單</button>
            <button class="secondary" type="reset">清除重填</button>
          </div>

          <div id="status" class="status" role="status" aria-live="polite"></div>
        </form>
      </section>


    </div>
  </main>

  <script>
    const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzSqb-Yz7SSQevrzxNqIwyesU71la1hQ46_bCMx7-_m7u9tijHW-amY9lDjY_q5xkY_/exec";
    const form = document.querySelector("#requestForm");
    const statusBox = document.querySelector("#status");
    const submitButton = document.querySelector("#submitButton");

    function setStatus(message, type = "") {
      statusBox.className = `status ${type}`.trim();
      statusBox.textContent = message;
    }

    function getPayload() {
      const data = new FormData(form);
      return {
        name: String(data.get("name") || "").trim(),
        unit: String(data.get("unit") || "").trim(),
        mainDemand: String(data.get("mainDemand") || "").trim(),
        demandDate: String(data.get("demandDate") || "").trim(),
        submittedAt: new Date().toISOString(),
        source: location.href
      };
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();

      if (!GOOGLE_SCRIPT_URL) {
        setStatus("尚未設定 Google Apps Script Web App URL，請先依 README 完成部署設定。", "warning");
        return;
      }

      submitButton.disabled = true;
      setStatus("資料送出中...");

      try {
        await fetch(GOOGLE_SCRIPT_URL, {
          method: "POST",
          mode: "no-cors",
          headers: {
            "Content-Type": "text/plain;charset=utf-8"
          },
          body: JSON.stringify(getPayload())
        });

        form.reset();
        setStatus("已送出。請等待技術委員會與您確認詳細需求。", "success");
      } catch (error) {
        setStatus("送出失敗，請稍後再試或聯絡管理者。", "error");
      } finally {
        submitButton.disabled = false;
      }
    });
  </script>
</body>
</html>
