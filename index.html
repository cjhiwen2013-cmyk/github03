<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TAIAA協會技術需求單</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #222b21;
      --muted: #525e50;
      --line: #cbd2c9;
      --field: #ffffff;
      --page: #e2e8e0;
      --panel: #ffffff;
      --primary: #5a6e58;
      --primary-strong: #455444;
      --accent: #bfa280;
      --success: #1f7a4d;
      --warning: #9a5b13;
      --danger: #a13737;
      font-family: Arial, "Microsoft JhengHei", "PingFang TC", sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      color: var(--ink);
      background:
        linear-gradient(135deg, rgba(90, 110, 88, .14), transparent 35%),
        linear-gradient(315deg, rgba(191, 162, 128, .15), transparent 35%),
        var(--page);
    }

    main {
      width: min(960px, calc(100% - 62px));
      margin: 0 auto;
      padding: 42px 0;
    }

    .layout {
      display: flex;
      justify-content: center;
    }

    .panel {
      width: min(680px, 100%);
    }

    .panel,
    .info {
      border: 1px solid rgba(111, 125, 150, .3);
      border-radius: 8px;
      background: rgba(255, 255, 255, .9);
      box-shadow: 0 18px 44px rgba(44, 58, 82, .12);
      backdrop-filter: blur(10px);
    }

    .panel {
      padding: 30px;
    }

    .info {
      padding: 20px;
    }

    .brand {
      display: flex;
      gap: 14px;
      align-items: center;
      margin-bottom: 26px;
    }

    .mark {
      display: grid;
      width: 52px;
      height: 52px;
      flex: 0 0 auto;
      place-items: center;
      border-radius: 8px;
      color: #fff;
      background: linear-gradient(135deg, var(--primary), var(--accent));
      font-weight: 800;
      letter-spacing: 0;
    }

    h1,
    h2,
    p {
      margin-top: 0;
    }

    h1 {
      margin-bottom: 6px;
      font-size: clamp(26px, 4vw, 36px);
      line-height: 1.2;
      letter-spacing: 0;
    }

    h2 {
      margin-bottom: 12px;
      font-size: 18px;
      letter-spacing: 0;
    }

    .subtitle,
    .info p,
    .hint {
      color: var(--muted);
      line-height: 1.65;
    }

    .subtitle {
      margin-bottom: 0;
      font-size: 15px;
    }

    label {
      display: block;
      margin: 18px 0 8px;
      font-weight: 700;
    }

    input,
    textarea {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 7px;
      background: var(--field);
      color: var(--ink);
      font: inherit;
      font-size: 16px;
      outline: none;
      padding: 13px 14px;
      transition: border-color .16s ease, box-shadow .16s ease;
    }

    textarea {
      min-height: 170px;
      resize: vertical;
      line-height: 1.6;
    }

    input:focus,
    textarea:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 4px rgba(23, 107, 135, .14);
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 24px;
    }

    button {
      min-height: 46px;
      border: 0;
      border-radius: 7px;
      cursor: pointer;
      font: inherit;
      font-weight: 700;
      padding: 0 18px;
    }

    button:disabled {
      cursor: not-allowed;
      opacity: .68;
    }

    .primary {
      color: #fff;
      background: var(--primary);
    }

    .primary:hover:not(:disabled) {
      background: var(--primary-strong);
    }

    .secondary {
      border: 1px solid var(--line);
      color: var(--ink);
      background: #fff;
    }

    .status {
      min-height: 24px;
      margin-top: 18px;
      color: var(--muted);
      font-weight: 700;
      line-height: 1.5;
    }

    .status.success {
      color: var(--success);
    }

    .status.warning {
      color: var(--warning);
    }

    .status.error {
      color: var(--danger);
    }

    .meta {
      display: grid;
      gap: 10px;
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .meta li {
      border-top: 1px solid var(--line);
      padding-top: 10px;
      color: var(--muted);
      line-height: 1.5;
    }

    .meta strong {
      display: block;
      color: var(--ink);
    }

    @media (max-width: 820px) {
      main {
        width: min(100% - 24px, 640px);
        padding: 18px 0;
      }

      /* 已移除無效的 grid-template-columns 規則 */

      .panel {
        padding: 22px;
      }

      .actions button {
        width: 100%;
      }
    }
    
    .logo {
      width: 100px;
      height: 100px;
      object-fit: contain;
      border-radius: 8px;
    }

    /* Drag & Drop Zone */
    .dropzone {
      border: 2px dashed var(--line);
      border-radius: 8px;
      padding: 30px;
      text-align: center;
      background: rgba(255, 255, 255, 0.5);
      cursor: pointer;
      transition: border-color 0.2s, background-color 0.2s;
      margin-bottom: 15px;
    }
    .dropzone.dragover {
      border-color: var(--primary);
      background: rgba(23, 107, 135, 0.05);
    }
    .dropzone p {
      margin: 0 0 10px 0;
      font-weight: bold;
      color: var(--muted);
    }
    .dropzone span {
      font-size: 13px;
      color: var(--muted);
      opacity: 0.8;
    }
    .file-list {
      margin-bottom: 20px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .file-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 12px;
      background: var(--page);
      border: 1px solid var(--line);
      border-radius: 6px;
      font-size: 14px;
    }
    .file-item .file-info {
      display: flex;
      align-items: center;
      gap: 10px;
      max-width: 85%;
    }
    .file-item .file-name {
      font-weight: 500;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .file-item .file-size {
      color: var(--muted);
      font-size: 12px;
    }
    .file-item .remove-btn {
      color: var(--danger);
      background: transparent;
      border: none;
      font-weight: bold;
      font-size: 18px;
      cursor: pointer;
      padding: 0 5px;
      min-height: auto;
    }    
  </style>
</head>
<body>
  <main>
    <div class="layout">
      <section class="panel" aria-labelledby="form-title">
        <div class="brand">
          <img class="logo" src="logo.png" alt="AI協會">
          <div>
            <h1 id="form-title">TAIAA協會技術支援需求表</h1>
            <p class="subtitle">請詳細填寫技術需求內容</p>
          </div>
        </div>

        <form id="requestForm">
          <label for="name">名字</label>
          <input id="name" name="name" autocomplete="name" required>

          <label for="unit">單位</label>
          <input id="unit" name="unit" autocomplete="organization" required>

          <label for="email">電子郵件</label>
          <input id="email" name="email" type="email" autocomplete="email" required>

          <label for="mainDemand">主要需求</label>
          <textarea id="mainDemand" name="mainDemand" required></textarea>

          <label for="file">上傳檔案 (最多 10 個檔案，總大小限 50MB 以下)</label>
          <div id="dropzone" class="dropzone">
            <p>拖曳檔案至此，或點擊選取檔案</p>
            <span>最多支援上傳 10 個檔案，總檔案大小需在 50MB 以內</span>
            <input type="file" id="file" name="file" multiple style="display: none;">
          </div>
          <div id="fileList" class="file-list"></div>

          <label for="demandDate">需求日期</label>
          <input id="demandDate" name="demandDate" type="date" required>

          <div class="actions">
            <button id="submitButton" class="primary" type="submit">送出表單</button>
            <button class="secondary" type="reset">清除重填</button>
          </div>

          <div id="status" class="status" role="status" aria-live="polite"></div>
        </form>
      </section>
    </div>
  </main>

  <script>
    const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyN3VYIN2QZJiPoa769CqkjZoBMxFmSLuKSF_7WMVDp_lU8h9Ft3GRYs8yhtpt0LhLY/exec";
    const form = document.querySelector("#requestForm");
    const statusBox = document.querySelector("#status");
    const submitButton = document.querySelector("#submitButton");

    function setStatus(message, type = "") {
      statusBox.className = `status ${type}`.trim();
      statusBox.textContent = message;
    }

    const dropzone = document.querySelector("#dropzone");
    const fileInput = document.querySelector("#file");
    const fileListContainer = document.querySelector("#fileList");
    let selectedFiles = []; // 儲存選取的 File 物件

    // 點擊區域觸發選擇檔案
    dropzone.addEventListener("click", () => {
      fileInput.click();
    });

    fileInput.addEventListener("change", (e) => {
      handleFiles(e.target.files);
      fileInput.value = ""; // 清空 value 以便重複選擇相同檔案
    });

    // 拖曳相關事件
    dropzone.addEventListener("dragover", (e) => {
      e.preventDefault();
      dropzone.classList.add("dragover");
    });

    dropzone.addEventListener("dragleave", () => {
      dropzone.classList.remove("dragover");
    });

    dropzone.addEventListener("drop", (e) => {
      e.preventDefault();
      dropzone.classList.remove("dragover");
      handleFiles(e.dataTransfer.files);
    });

    function handleFiles(files) {
      for (let i = 0; i < files.length; i++) {
        const file = files[i];
        
        // 檢查是否重複
        if (selectedFiles.some(f => f.name === file.name && f.size === file.size)) {
          alert(`檔案「${file.name}」已在待上傳清單中！`);
          continue;
        }

        // 限制最多 10 個檔案
        if (selectedFiles.length >= 10) {
          alert("最多只能上傳 10 個檔案！");
          break;
        }

        selectedFiles.push(file);
      }
      renderFileList();
    }

    function renderFileList() {
      fileListContainer.innerHTML = "";
      selectedFiles.forEach((file, index) => {
        const item = document.createElement("div");
        item.className = "file-item";
        
        const info = document.createElement("div");
        info.className = "file-info";
        info.innerHTML = `<span class="file-name">${file.name}</span><span class="file-size">(${(file.size / 1024 / 1024).toFixed(2)} MB)</span>`;
        
        const removeBtn = document.createElement("button");
        removeBtn.type = "button";
        removeBtn.className = "remove-btn";
        removeBtn.textContent = "×";
        removeBtn.addEventListener("click", () => {
          selectedFiles.splice(index, 1);
          renderFileList();
        });
        
        item.appendChild(info);
        item.appendChild(removeBtn);
        fileListContainer.appendChild(item);
      });
    }

    function fileToBase64(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.readAsDataURL(file);
        reader.onload = () => resolve(reader.result.split(',')[1]);
        reader.onerror = error => reject(error);
      });
    }

    async function getPayload() {
      const data = new FormData(form);
      
      // 格式化送出時間為 "yyyy/M/d 上午/下午 hh:mm:ss"
      const now = new Date();
      const year = now.getFullYear();
      const month = now.getMonth() + 1;
      const date = now.getDate();
      let hours = now.getHours();
      const minutes = String(now.getMinutes()).padStart(2, '0');
      const seconds = String(now.getSeconds()).padStart(2, '0');
      const ampm = hours >= 12 ? '下午' : '上午';
      hours = hours % 12;
      hours = hours ? hours : 12;
      const formattedDate = `${year}/${month}/${date} ${ampm} ${hours}:${minutes}:${seconds}`;

      // 檢查總檔案大小與編碼
      let totalSize = 0;
      const filesPayload = [];
      
      for (const file of selectedFiles) {
        totalSize += file.size;
        if (totalSize > 50 * 1024 * 1024) {
          throw new Error("所有上傳檔案的總大小不能超過 50MB！");
        }
        
        const base64Data = await fileToBase64(file);
        filesPayload.push({
          name: file.name,
          type: file.type,
          data: base64Data
        });
      }

      return {
        name: String(data.get("name") || "").trim(),
        unit: String(data.get("unit") || "").trim(),
        email: String(data.get("email") || "").trim(),
        mainDemand: String(data.get("mainDemand") || "").trim(),
        demandDate: String(data.get("demandDate") || "").trim(),
        submittedAt: formattedDate,
        source: location.href,
        files: filesPayload
      };
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();

      if (!GOOGLE_SCRIPT_URL) {
        setStatus("尚未設定 Google Apps Script Web App URL，請先依 README 完成部署設定。", "warning");
        return;
      }

      submitButton.disabled = true;
      setStatus("資料與檔案上傳中...");

      try {
        const payload = await getPayload();
        const response = await fetch(GOOGLE_SCRIPT_URL, {
          method: "POST",
          mode: "cors",
          headers: {
            "Content-Type": "text/plain"
          },
          body: JSON.stringify(payload)
        });

        const result = await response.json();
        if (result.status === "success") {
          form.reset();
          selectedFiles = []; // 清空選取檔案
          renderFileList();
          setStatus("已送出。請等待技術委員會與您確認詳細需求。", "success");
        } else {
          throw new Error(result.message || "主機處理失敗");
        }
      } catch (error) {
        console.error("提交錯誤:", error);
        setStatus("送出失敗: " + error.message, "error");
      } finally {
        submitButton.disabled = false;
      }
    });
  </script>
</body>
</html>
